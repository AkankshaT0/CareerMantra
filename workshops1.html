<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="CareerLogo.png" />
<title>Workshops & Seminars</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#f5f6ff;
  --card:#ffffff;
  --text:#1A2A80;
}
.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e5e7eb;
}

body{
  background:var(--bg);
  color:var(--text);
  transition:.4s;
}

.card-custom{
  background:var(--card);
  border-radius:14px;
  box-shadow:0 6px 15px rgba(0,0,0,.15);
}

.dark .form-control,
.dark textarea{
  background:#020617;
  color:#e5e7eb;
  border:1px solid #475569;
}

.dark .navbar{
  background:#020617!important;
}

.dark ::placeholder{
  color:#e5e7eb;
}
.btn-grp{
  background-color: rgb(72, 70, 70);
  opacity: 0.7;
  transition:.8s;
  margin-right: 5px;
  width: 200px;
}
.btn-grp:hover{
  background-color: black;
  opacity: 1;
  transition:.8s;

}
.bell-icon{
  margin-left: 10px;
  font-size: 1.3rem;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-4">
  <span class="navbar-brand fw-bold">CareerMantra – Workshops & Seminars</span>
  <div class="d-flex gap-2">
    <button class="btn btn-light btn-sm" onclick="toggleTheme()">🌗</button>
    <button id="logoutBtn" class="btn btn-warning btn-sm">Logout</button>
  </div>
</nav>

<div class="container my-4">
<div class="card-custom p-3 mb-4">
<h4>Add / Update Workshop<i class="fa-solid fa-bell bell-icon"></i></h4>
<br>
<form id="workshopForm">
  <input class="form-control mb-2" id="title" placeholder="Workshop Title" required>
  <textarea class="form-control mb-2" id="description" placeholder="Description" required></textarea>
  <input class="form-control mb-2" type="date" id="date" required>
  <input class="form-control mb-2" type="time" id="time" required>
  <input class="form-control mb-2" id="location" placeholder="Location" required>
  <input class="form-control mb-2" id="link" placeholder="Workshop Link">
  <br>
  <button class="btn btn-success w-100">Save Workshop</button>
</form>
</div>

<h4>Your Workshops</h4>
<a href="analyzer.html" class="btn btn-dark mb-3">📊 Analyze Workshops</a>
<div id="userWorkshops" class="row g-3"></div>

<h4 class="mt-4">Upcoming Global Seminars</h4>
<input class="form-control mb-3" id="searchBox" placeholder="Search seminars...">
<div id="globalWorkshops" class="row g-3"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
 apiKey:"AIzaSyCBfr5gR5pihZoSTvId8E5Ty_5RCL5MYhw",
 authDomain:"auth-demo-37f58.firebaseapp.com",
 projectId:"auth-demo-37f58",
 storageBucket:"auth-demo-37f58.firebasestorage.app",
 messagingSenderId:"799076361553",
 appId:"1:799076361553:web:6ff356a4d894a27cfb9f70"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let currentUser=null;
let updateId=null;

/* THEME */
window.toggleTheme=()=>{
 document.body.classList.toggle("dark");
 localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light");
};
if(localStorage.getItem("theme")==="dark") document.body.classList.add("dark");

/* AUTH CHECK */
onAuthStateChanged(auth,user=>{
 if(user){
  currentUser=user;
  loadUserWorkshops();
  loadGlobalWorkshops();
 }else{
  window.location.href="loginPage.html";
 }
});

/* LOGOUT */
logoutBtn.onclick=async()=>{
 await signOut(auth);
 window.location.href="loginPage.html";
};

/* ADD / UPDATE WORKSHOP */
workshopForm.addEventListener("submit",async e=>{
 e.preventDefault();
 if(!currentUser) return;

 const data={
  title:document.getElementById("title").value.trim(),
  description:document.getElementById("description").value.trim(),
  date:document.getElementById("date").value,
  time:document.getElementById("time").value,
  location:document.getElementById("location").value.trim(),
  link:document.getElementById("link").value || null,
  applied:false,
  createdAt:new Date()
 };

 if(updateId){
  await updateDoc(doc(db,`users/${currentUser.uid}/workshops`,updateId),data);
  updateId=null;
 }else{
  await addDoc(collection(db,`users/${currentUser.uid}/workshops`),data);
 }

 workshopForm.reset();
 loadUserWorkshops();
});

/* LOAD USER WORKSHOPS */
async function loadUserWorkshops(){
 userWorkshops.innerHTML="";
 const snap=await getDocs(collection(db,`users/${currentUser.uid}/workshops`));

 snap.forEach(d=>{
  const w=d.data();
  const expired=new Date(w.date+" "+w.time)<new Date();

  const col=document.createElement("div");
  col.className="col-md-4";
  col.innerHTML=`
  <div class="card-custom p-3">
    <h5>${w.title}</h5>
    <p>${w.description}</p>
    <p>${w.date} ${w.time}</p>
    <p>${w.location}</p>
    ${w.applied?'<span class="badge bg-success">Applied</span>':''}
    ${expired?'<span class="badge bg-danger ms-2">Expired</span>':''}
    <br><br>
    <div class="d-flex gap-2 mt-2">
      <button class="btn btn-grp btn-sm btn-primary applyBtn">Apply</button>
      <button class="btn btn-grp btn-sm btn-success updateBtn">Update</button>
      <button class="btn btn-grp btn-sm btn-danger deleteBtn">Delete</button>
    </div>
  </div>`;
  userWorkshops.appendChild(col);

  col.querySelector(".deleteBtn").onclick=async()=>{
   await deleteDoc(doc(db,`users/${currentUser.uid}/workshops`,d.id));
   loadUserWorkshops();
  };

  col.querySelector(".updateBtn").onclick=()=>{
   title.value=w.title;
   description.value=w.description;
   date.value=w.date;
   time.value=w.time;
   location.value=w.location;
   link.value=w.link||"";
   updateId=d.id;
  };

  col.querySelector(".applyBtn").onclick=async()=>{
   await updateDoc(doc(db,`users/${currentUser.uid}/workshops`,d.id),{
    applied:true,
    lastApplied:new Date()
   });
   loadUserWorkshops();
  };
 });
}

/* GLOBAL WORKSHOPS */
async function loadGlobalWorkshops(){
 globalWorkshops.innerHTML="";
 const snap=await getDocs(collection(db,"workshops"));

 snap.forEach(d=>{
  const w=d.data();
  const expired=new Date(w.date+" "+w.time)<new Date();

  const col=document.createElement("div");
  col.className="col-md-4";
  col.innerHTML=`
  <div class="card-custom p-3">
   <h5>${w.title}</h5>
   <p>${w.description}</p>
   <p>${w.date} ${w.time}</p>
   <p>${w.location}</p>
   ${expired?'<span class="badge bg-danger">Expired</span>':''}
   ${w.link?`<a href="${w.link}" target="_blank">Join</a>`:""}
  </div>`;
  globalWorkshops.appendChild(col);
 });
}

/* SEARCH */
searchBox.addEventListener("input",()=>{
 const t=searchBox.value.toLowerCase();
 document.querySelectorAll("#globalWorkshops .card-custom").forEach(c=>{
  c.style.display=c.innerText.toLowerCase().includes(t)?"block":"none";
 });
});
</script>

</body>
</html>
