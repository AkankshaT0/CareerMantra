<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs & Internship Alerts</title>
<link rel="icon" href="CareerLogo.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
  --bg:#f5f6ff;
  --card:#ffffff;
  --text:#1A2A80;
}
.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e5e7eb;
}
body{background:var(--bg);color:var(--text);transition:.4s;}

.card-custom{
  background:var(--card);
  border-radius:14px;
  box-shadow:0 6px 15px rgba(0,0,0,.15);
}
.dark .form-control,.dark textarea,.dark select{
  background:#020617;color:#e5e7eb;border:1px solid #475569;
}
.dark ::placeholder{color:#d6ddea;}

.btn-grpp{
  background-color: rgb(72, 70, 70);
  opacity: 0.7;
  transition:.8s;

}
.btn-grpp:hover{
  background-color: black;
  opacity: 1;
  transition:.8s;
}
.btn-grpp{
  background-color: rgb(72, 70, 70);
  opacity: 0.7;
  transition:.8s;
  margin-right: 5px;
  width: 150px;
}
.btn-grpp:hover{
  background-color: black;
  opacity: 1;
  transition:.8s;
}
.btn-addJob{
  background-color: rgb(72, 70, 70);
  opacity: 0.7;
  transition:.8s;
  margin-right: 5px;
  width: 300px;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-4">
  <span class="navbar-brand fw-bold">CareerMantra – Jobs</span>
  <button class="btn btn-light btn-sm" onclick="toggleTheme()">🌗</button>
</nav>

<div class="container my-4">

<div class="card-custom p-3 mb-4">
<h4 id="formTitle">Add Job Alert</h4>
<div class="row g-2">
 <div class="col-md-6"><input class="form-control" id="jobTitle" placeholder="Job Title"></div>
 <div class="col-md-6"><input class="form-control" id="company" placeholder="Company"></div>
 <div class="col-md-4"><input class="form-control" type="date" id="date"></div>
 <div class="col-md-4"><input class="form-control" id="location" placeholder="Location"></div>
 <div class="col-md-4"><input class="form-control" id="link" placeholder="Job Link"></div>

 <div class="col-md-6">
  <select class="form-control" id="status">
   <option value="Pending">Pending</option>
   <option value="Rejected">Rejected</option>
   <option value="Hired">Hired</option>
  </select>
 </div>

 <div class="col-md-6">
  <select class="form-control" id="applied">
   <option value="false">Not Applied</option>
   <option value="true">Applied</option>
  </select>
 </div>

 <div class="col-12">
  <textarea class="form-control" id="description" placeholder="Description"></textarea>
 </div>
</div>

<div class="text-center mt-3">
 <button class="btn btn-success px-4 btn-addJob" id="addJob ">Save Job</button>
 <button class="btn btn-warning px-4" id="updateJob" style="display:none;">Update Job</button>
</div>
</div>

<h4>Your Jobs</h4>
<div id="jobsList" class="row g-3"></div>

<h4 class="mt-4">Internships from Admin</h4>
<div id="internshipsList" class="row g-3"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCBfr5gR5pihZoSTvId8E5Ty_5RCL5MYhw",
 authDomain:"auth-demo-37f58.firebaseapp.com",
 projectId:"auth-demo-37f58",
 storageBucket:"auth-demo-37f58.firebasestorage.app",
 messagingSenderId:"799076361553",
 appId:"1:799076361553:web:6ff356a4d894a27cfb9f70"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let editJobId=null;

/* THEME */
window.toggleTheme=()=>{
 document.body.classList.toggle("dark");
 localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light");
};
if(localStorage.getItem("theme")==="dark") document.body.classList.add("dark");

/* AUTH */
onAuthStateChanged(auth,user=>{
 if(user){
  currentUser=user;
  loadUserJobs();
  loadInternships();
 }else{
  window.location.href="loginPage.html";
 }
});

/* SAVE JOB */
document.getElementById("addJob").addEventListener("click",async()=>{
 const job=getFormData();
 if(!job.title || !job.company){alert("Enter job title & company");return;}
 await addDoc(collection(db,"users",currentUser.uid,"jobs"),job);
 clearForm();
 loadUserJobs();
});

/* UPDATE JOB */
document.getElementById("updateJob").addEventListener("click",async()=>{
 await updateDoc(doc(db,"users",currentUser.uid,"jobs",editJobId),getFormData());
 editJobId=null;
 document.getElementById("formTitle").innerText="Add Job Alert";
 document.getElementById("addJob").style.display="inline-block";
 document.getElementById("updateJob").style.display="none";
 clearForm();
 loadUserJobs();
});

/* LOAD JOBS */
async function loadUserJobs(){
 jobsList.innerHTML="";
 const snap=await getDocs(collection(db,"users",currentUser.uid,"jobs"));
 snap.forEach(d=>{
  const j=d.data();
  const expired=j.applied==="false" && new Date(j.date)<new Date();

  const col=document.createElement("div");
  col.className="col-md-4";
  col.innerHTML=`
  <div class="card-custom p-3 h-100">
   <h5>${j.title}</h5>
   <p>${j.company}</p>
   <p>${j.location}</p>
   <p>Status: <b>${j.status}</b></p>
   <p>Applied: ${j.applied==="true"?"Yes":"No"}</p>
   ${expired?'<span class="badge bg-danger">Expired</span>':''}
   <div class="mt-2">
    <button class="btn btn-grpp btn-sm btn-success updateBtn">Update</button>
    <button class="btn btn-grpp btn-sm btn-danger deleteBtn">Delete</button>
   </div>
  </div>`;
  jobsList.appendChild(col);

  col.querySelector(".deleteBtn").onclick=async()=>{
   await deleteDoc(doc(db,"users",currentUser.uid,"jobs",d.id));
   loadUserJobs();
  };

  col.querySelector(".updateBtn").onclick=()=>{
   fillForm(j);
   editJobId=d.id;
   formTitle.innerText="Update Job";
   addJob.style.display="none";
   updateJob.style.display="inline-block";
  };
 });
}

/* ADMIN INTERNSHIPS */
async function loadInternships(){
 internshipsList.innerHTML="";
 const snap=await getDocs(collection(db,"internships"));
 snap.forEach(d=>{
  const i=d.data();
  const col=document.createElement("div");
  col.className="col-md-4";
  col.innerHTML=`
  <div class="card-custom p-3 h-100">
   <h5>${i.title}</h5>
   <p>${i.company}</p>
   <p>${i.location}</p>
   <a href="${i.link}" target="_blank">Apply</a>
  </div>`;
  internshipsList.appendChild(col);
 });
}

/* HELPERS */
function getFormData(){
 return{
  title:document.getElementById("jobTitle").value,
  company:document.getElementById("company").value,
  date:document.getElementById("date").value,
  location:document.getElementById("location").value,
  link:document.getElementById("link").value,
  description:document.getElementById("description").value,
  status:document.getElementById("status").value,
  applied:document.getElementById("applied").value,
  timestamp:new Date()
 };
}
function fillForm(j){
 jobTitle.value=j.title;
 company.value=j.company;
 date.value=j.date;
 location.value=j.location;
 link.value=j.link;
 description.value=j.description;
 status.value=j.status;
 applied.value=j.applied;
}
function clearForm(){
 jobTitle.value="";
 company.value="";
 date.value="";
 location.value="";
 link.value="";
 description.value="";
 status.value="Pending";
 applied.value="false";
}
</script>
</body>
</html>
