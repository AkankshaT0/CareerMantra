function showRoadmap() {
  let skill = document.getElementById("skill").value;
  let data = roadmaps[skill];

  if(!data){
    document.getElementById("result").innerHTML = "Roadmap not available.";
    return;
  }

  let output = `
  <h2>${data.title}</h2>
  <p><b>⏳ Duration:</b> ${data.duration}</p>
  <p><b>🎯 Focus:</b> ${data.focus}</p>
  <p><b>➕ Extra Skills:</b> ${data.extraSkills}</p>
  <hr>
  `;

  data.stages.forEach(stage => {
    output += `
    <div class="stage">
      <h4>${stage.title}</h4>
      <p><b>📘 Learn:</b> ${stage.learn}</p>
      <p><b>📍 Where:</b> ${stage.where}</p>
      <p><b>🛠 Do:</b> ${stage.do}</p>
    </div>
    `;
  });

  document.getElementById("result").innerHTML = output;
}
