<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="CareerLogo.png" />
<title>Achievements & Badges</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
  --bg:#f5f6ff;
  --card:#ffffff;
  --text:#1A2A80;
}
.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e5e7eb;
}

body{
  background:var(--bg);
  color:var(--text);
  transition:.4s;
}

.card-custom{
  background:var(--card);
  border-radius:14px;
  box-shadow:0 6px 15px rgba(0,0,0,.15);
}

.dark .form-control,
.dark textarea{
  background:#020617;
  color:#e5e7eb;
  border:1px solid #475569;
}

.dark .navbar{
  background:#020617!important;
}

.dark ::placeholder{
  color:#e5e7eb;
}
.btn-grp{
  background-color: rgb(72, 70, 70);
  opacity: 0.7;
  transition:.8s;
  margin-right: 5px;
  width: 200px;
}
.btn-grp:hover{
  background-color: black;
  opacity: 1;
  transition:.8s;
}
.btn-addAchievement{
  background-color: rgb(72, 70, 70);
  opacity: 0.7;
  transition:.8s;
  margin-right: 5px;
  width: 300px;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-4">
  <span class="navbar-brand fw-bold">CareerMantra – Achievements & Badges</span>
  <div class="d-flex gap-2">
    <button class="btn btn-light btn-sm" onclick="toggleTheme()">🌗</button>
  </div>
</nav>

<div class="container my-4">

<div class="card-custom p-3 mb-4">
<h4>Add / Update Achievement</h4>
<div class="row g-2">
  <div class="col-12">
    <input class="form-control" id="achTitle" placeholder="Achievement Title">
  </div>
  <div class="col-12">
    <textarea class="form-control" id="achDesc" rows="3" placeholder="Description"></textarea>
  </div>
</div>
<div class="text-center mt-3">
  <button class="btn btn-success px-5 btn-addAchievement" id="addAchievementBtn">Save Achievement</button>
</div>
</div>

<div class="d-flex justify-content-between mb-3">
  <input class="form-control w-50" id="searchBox" placeholder="Search achievements...">
  <span class="fw-bold">Achievement Score: <span id="score">0</span>/100</span>
</div>

<div id="achievementsList" class="row g-3"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyCBfr5gR5pihZoSTvId8E5Ty_5RCL5MYhw",
 authDomain:"auth-demo-37f58.firebaseapp.com",
 projectId:"auth-demo-37f58",
 storageBucket:"auth-demo-37f58.firebasestorage.app",
 messagingSenderId:"799076361553",
 appId:"1:799076361553:web:6ff356a4d894a27cfb9f70"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let updateId=null;

/* THEME */
window.toggleTheme=()=>{
 document.body.classList.toggle("dark");
 localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light");
};
if(localStorage.getItem("theme")==="dark") document.body.classList.add("dark");

/* AUTH */
onAuthStateChanged(auth,user=>{
 if(!user){
  alert("Please login!");
  window.location.href="loginPage.html";
  return;
 }
 currentUser=user;
 loadAchievements();
});

/* ADD / UPDATE */
addAchievementBtn.addEventListener("click",async()=>{
 const title=document.getElementById("achTitle").value.trim();
 const desc=document.getElementById("achDesc").value.trim();

 if(!title) return alert("Enter achievement title");

 const data={
  title,
  description:desc,
  approved:false,
  tags:title.toLowerCase(),   // ML ready
  timestamp:new Date()
 };

 if(updateId){
  await updateDoc(doc(db,"users",currentUser.uid,"achievements",updateId),data);
  updateId=null;
  addAchievementBtn.textContent="Save Achievement";
 }else{
  await addDoc(collection(db,"users",currentUser.uid,"achievements"),data);
 }

 achTitle.value="";
 achDesc.value="";
 loadAchievements();
});

/* LOAD */
async function loadAchievements(){
 achievementsList.innerHTML="";
 const snap=await getDocs(collection(db,"users",currentUser.uid,"achievements"));

 let score=0;

 if(snap.empty){
  achievementsList.innerHTML="<p class='text-center'>No achievements added yet</p>";
  return;
 }

 snap.forEach(d=>{
  const a=d.data();
  score+=10;

  const col=document.createElement("div");
  col.className="col-md-4";
  col.innerHTML=`
   <div class="card-custom p-3 h-100">
     <h5>${a.title}</h5>
     <p>${a.description}</p>
     <p>Status: <span class="${a.approved?'text-success':'text-warning'} fw-bold">
       ${a.approved?'Approved ✅':'Pending ⏳'}
     </span></p>

     <div class="d-flex gap-2 mt-2">
       <button class="btn btn-sm btn-success updateBtn btn-grp">Update</button>
       <button class="btn btn-sm btn-danger deleteBtn btn-grp">Delete</button>
     </div>
   </div>`;
  achievementsList.appendChild(col);

  col.querySelector(".deleteBtn").onclick=async()=>{
   if(confirm("Delete this achievement?")){
     await deleteDoc(doc(db,"users",currentUser.uid,"achievements",d.id));
     loadAchievements();
   }
  };

  col.querySelector(".updateBtn").onclick=()=>{
   achTitle.value=a.title;
   achDesc.value=a.description;
   updateId=d.id;
   addAchievementBtn.textContent="Update Achievement";
  };
 });

 score=Math.min(score,100);
 document.getElementById("score").innerText=score;
}

/* SEARCH */
searchBox.addEventListener("input",()=>{
 const t=searchBox.value.toLowerCase();
 document.querySelectorAll("#achievementsList .card-custom").forEach(c=>{
  c.style.display=c.innerText.toLowerCase().includes(t)?"block":"none";
 });
});
</script>

</body>
</html>
