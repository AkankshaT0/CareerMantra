<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { getAuth,onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyCBfr5gR5pihZoSTvId8E5Ty_5RCL5MYhw",
authDomain:"auth-demo-37f58.firebaseapp.com",
projectId:"auth-demo-37f58",
storageBucket:"auth-demo-37f58.firebasestorage.app",
messagingSenderId:"799076361553",
appId:"1:799076361553:web:6ff356a4d894a27cfb9f70"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

let currentUser=null;

const skillCardsDiv=document.getElementById("skillCards");


/* THEME */

window.toggleTheme=()=>{

document.body.classList.toggle("dark");

};


/* RENDER SKILLS */

async function renderSkills(){

if(!currentUser) return;

const ref=collection(db,"users",currentUser.uid,"skills");

const snap=await getDocs(ref);

skillCardsDiv.innerHTML="";

snap.forEach(d=>{

const s=d.data();

const progress=
s.level==="Beginner"?30:
s.level==="Intermediate"?60:
100;

const col=document.createElement("div");

col.className="col-md-4 mb-4";

col.innerHTML=`

<div class="card card-custom p-3">

<input class="form-control mb-2" id="name_${d.id}" value="${s.name}">

<select class="form-select mb-2" id="level_${d.id}">
<option ${s.level=="Beginner"?"selected":""}>Beginner</option>
<option ${s.level=="Intermediate"?"selected":""}>Intermediate</option>
<option ${s.level=="Advanced"?"selected":""}>Advanced</option>
</select>

<div class="progress mb-2">
<div class="progress-bar bg-primary" style="width:${progress}%"></div>
</div>

<small class="progressVal">${progress}% completed</small>

<div class="d-flex gap-2 mt-3">

<button class="btn btn-success btn-grp w-100"
onclick="updateSkill('${d.id}')">
Update
</button>

<button class="btn btn-danger btn-grp w-100"
onclick="deleteSkill('${d.id}')">
Delete
</button>

</div>

</div>`;

skillCardsDiv.appendChild(col);

});

}


/* ADD SKILL */

window.addSkill=async()=>{

if(!currentUser) return alert("Login first");

const name=skillName.value.trim();

if(!name) return alert("Enter skill name");

await addDoc(
collection(db,"users",currentUser.uid,"skills"),
{
name,
level:skillLevel.value,
category:skillCategory.value,
createdAt:new Date()
});

skillName.value="";

renderSkills();

};


/* UPDATE */

window.updateSkill=async(id)=>{

const name=document.getElementById(`name_${id}`).value.trim();

const level=document.getElementById(`level_${id}`).value;

await updateDoc(
doc(db,"users",currentUser.uid,"skills",id),
{
name,
level
});

renderSkills();

};


/* DELETE */

window.deleteSkill=async(id)=>{

if(confirm("Delete this skill?")){

await deleteDoc(
doc(db,"users",currentUser.uid,"skills",id)
);

renderSkills();

}

};


/* GET USER SKILLS */

async function getUserSkills(){

const ref=collection(db,"users",currentUser.uid,"skills");

const snap=await getDocs(ref);

let skills=[];

snap.forEach(d=>{
skills.push(d.data().name);
});

return skills;

}


/* AI ANALYSIS */

window.analyzeSkillGap=async()=>{

if(!currentUser) return alert("Login first");

const skills=await getUserSkills();

const career=document.getElementById("careerSelect").value;

const response=await fetch(
"http://127.0.0.1:5000/skill-gap",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
skills:skills,
career:career
})
});

const result=await response.json();

showPrediction(result);

};


/* SHOW RESULT */

function showPrediction(result){

document.getElementById("matchScore").innerText=
"Career Match Score : "+result.match_score+"%";

const list=document.getElementById("missingSkills");

list.innerHTML="";

result.missing_skills.forEach(skill=>{

const li=document.createElement("li");

li.innerText=skill;

list.appendChild(li);

});

}


/* AUTH */

onAuthStateChanged(auth,user=>{

if(user){

currentUser=user;

renderSkills();

}

});

</script>
